<meta name="application-name" content="Orto SPO 2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orto SPO 2026">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F3F4F6;color:#1A1A1A;font-size:14px}
.topbar{background:#1D4E45;color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.sync{font-size:11px;color:#86EFAC;display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75}
.sync-dot.syncing{background:#FCD34D;animation:pulse 1s infinite}
.sync-dot.error{background:#EF4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{background:#fff;border-bottom:1px solid #E5E7EB;padding:0 20px;display:flex;gap:2px}
.tab{padding:13px 18px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#6B7280;border-bottom:2px solid transparent}
.tab.active{color:#1D4E45;border-bottom-color:#1D9E75}
.content{padding:20px;max-width:600px;margin:0 auto}
.sec{display:none}.sec.active{display:block}
.event-banner{background:linear-gradient(135deg,#1D4E45,#1D9E75);border-radius:12px;padding:22px 20px;color:#fff;text-align:center;margin-bottom:20px}
.event-banner h1{font-size:20px;font-weight:800;margin-bottom:4px}
.event-banner p{font-size:12px;color:#A7F3D0}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.metric{background:#fff;border-radius:10px;padding:16px;text-align:center;border:1px solid #E5E7EB}
.metric-val{font-size:28px;font-weight:800;color:#1D9E75}
.metric-lbl{font-size:11px;color:#6B7280;margin-top:2px}
.form-card{background:#fff;border-radius:12px;padding:20px;border:1px solid #E5E7EB}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:12px;font-weight:700;color:#1D4E45}
.fg .opt{font-weight:400;color:#9CA3AF;font-size:11px}
.fg input,.fg select{font-size:15px;padding:11px 12px;border:1.5px solid #E5E7EB;border-radius:8px;width:100%;background:#F9FAFB}
.fg input:focus,.fg select:focus{outline:none;border-color:#1D9E75;background:#fff}
.btn-submit{width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:10px;background:#1D9E75;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.btn-submit:hover{background:#0F6E56}
.btn-submit:disabled{background:#9CA3AF;cursor:not-allowed}
.success-box{background:#DCFCE7;border:1.5px solid #86EFAC;border-radius:12px;padding:20px;text-align:center;margin-bottom:16px;display:none}
.success-box.show{display:block}
.success-box i{font-size:36px;color:#14532D}
.success-box h3{font-size:16px;color:#14532D;margin:8px 0 4px}
.success-box p{font-size:12px;color:#166534}
.list-table{background:#fff;border-radius:10px;border:1px solid #E5E7EB;overflow:hidden}
.list-hdr,.list-row{display:grid;grid-template-columns:2fr 1.3fr 1.2fr 1.2fr .5fr;gap:8px;padding:11px 14px;align-items:center;font-size:12px}
.list-hdr{background:#F9FAFB;font-weight:700;color:#6B7280;border-bottom:1px solid #E5E7EB}
.list-row{border-bottom:1px solid #F3F4F6}
.btn-del{background:transparent;border:none;color:#EF4444;cursor:pointer;font-size:16px;padding:4px;display:flex;align-items:center;justify-content:center}
.btn-del:hover{color:#B91C1C}
.list-name{font-weight:700;font-size:13px}
.list-sub{font-size:11px;color:#9CA3AF}
.list-empty{text-align:center;padding:40px;color:#9CA3AF;font-size:13px}
.exec-tag{font-size:10px;background:#E8F5F0;color:#1D4E45;padding:2px 7px;border-radius:10px;display:inline-block}
@media(max-width:480px){
  .list-hdr,.list-row{grid-template-columns:2fr 1.2fr 1.2fr .4fr;}
  .list-hdr span:nth-child(4),.list-row>*:nth-child(4){display:none}
}
</style>

<script>
const SB_URL='https://ngayznexxlwxpotdhmor.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nYXl6bmV4eGx3eHBvdGRobW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzgxNTQsImV4cCI6MjA5Njc1NDE1NH0.4OBbve7jnpmOMBcru4cnvmeubqybIq-P6pkpGCLvdwE';
const HDR={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};

const EXECS=['Guilherme Batochio','Bruno Scodino','William Galdino','Marcelo Giusti','Regiane Pagotto','Fabiano Nunes','Cirlene Fortuna','Pedro Nascimento','Adriana Lemos','Erica Lacerda','Celso Melgaço','Ana Carolina Barbeiro','Beatriz Miyake','Gisele de Oliveira','João Menezes','Leonardo Nunes'];

let data=[];

function setSS(s){
  const d=document.getElementById('sdot'),l=document.getElementById('slbl');
  if(s==='ok'){d.className='sync-dot';l.textContent='Ao vivo';}
  else if(s==='sync'){d.className='sync-dot syncing';l.textContent='Salvando...';}
  else{d.className='sync-dot error';l.textContent='Erro de conexão';}
}

async function sbGet(){
  const r=await fetch(SB_URL+'/rest/v1/orto_sp_2026?select=*&order=created_at.desc',{headers:HDR});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbInsert(rec){
  const r=await fetch(SB_URL+'/rest/v1/orto_sp_2026',{method:'POST',headers:HDR,body:JSON.stringify(rec)});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function sbDelete(id){
  const r=await fetch(SB_URL+'/rest/v1/orto_sp_2026?id=eq.'+id,{method:'DELETE',headers:HDR});
  if(!r.ok)throw new Error(await r.text());
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function v(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function today(){return new Date().toISOString().slice(0,10);}

async function loadData(silent=false){
  if(!silent)setSS('sync');
  try{
    data=await sbGet();
    setSS('ok');
    renderAll();
  }catch(e){
    setSS('error');
    console.error(e);
  }
}

function renderAll(){
  const total=data.length;
  const hoje=data.filter(d=>(d.created_at||'').slice(0,10)===today()).length;
  document.getElementById('m-total').textContent=total;
  document.getElementById('m-hoje').textContent=hoje;
  document.getElementById('m-total2').textContent=total;
  document.getElementById('m-hoje2').textContent=hoje;

  const sel=document.getElementById('f-exec');
  if(sel&&sel.options.length<=1){
    EXECS.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;sel.appendChild(o);});
  }

  const body=document.getElementById('lista-body');
  if(!data.length){
    body.innerHTML='<div class="list-empty"><i class="ti ti-users" style="font-size:24px;display:block;margin-bottom:8px"></i>Nenhum lead cadastrado ainda</div>';
    return;
  }
  body.innerHTML=data.map(d=>`<div class="list-row">
    <div><div class="list-name">${d.nome||'–'}</div>${d.email?'<div class="list-sub">'+d.email+'</div>':''}</div>
    <div style="font-size:12px">${d.cidade_estado||'–'}${d.bairro?'<div class="list-sub">'+d.bairro+'</div>':''}</div>
    <div><span class="exec-tag">${(d.executivo||'').split(' ')[0]||'–'}</span></div>
    <div style="font-size:12px;color:#6B7280">${d.telefone||'–'}</div>
    <div><button class="btn-del" onclick="deleteLead('${d.id}','${(d.nome||'').replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button></div>
  </div>`).join('');
}

async function submitLead(){
  const nome=v('f-nome');
  const tel=v('f-tel');
  const cidade=v('f-cidade');
  const bairro=v('f-bairro');
  const exec=v('f-exec');
  const email=v('f-email');

  if(!nome){alert('Informe o nome do dentista');return;}
  if(!tel){alert('Informe o telefone');return;}
  if(!cidade){alert('Informe a cidade/estado');return;}
  if(!exec){alert('Selecione o executivo responsável');return;}

  const btn=document.getElementById('btnSubmit');
  btn.disabled=true;
  btn.innerHTML='<i class="ti ti-loader-2"></i> Salvando...';
  setSS('sync');

  try{
    await sbInsert({
      id:uid(),
      nome,
      telefone:tel,
      cidade_estado:cidade,
      bairro:bairro||null,
      executivo:exec,
      email:email||null
    });
    document.getElementById('f-nome').value='';
    document.getElementById('f-bairro').value='';
    document.getElementById('f-tel').value='';
    document.getElementById('f-cidade').value='';
    document.getElementById('f-exec').value='';
    document.getElementById('f-email').value='';

    const sb=document.getElementById('successBox');
    sb.classList.add('show');
    setTimeout(()=>sb.classList.remove('show'),2500);

    await loadData(true);
    document.getElementById('f-nome').focus();
  }catch(e){
    setSS('error');
    alert('Erro ao salvar: '+e.message);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="ti ti-plus"></i> Cadastrar Lead';
  }
}

async function deleteLead(id,nome){
  if(!confirm('Excluir o lead de '+nome+'?'))return;
  setSS('sync');
  try{
    await sbDelete(id);
    await loadData(true);
  }catch(e){
    setSS('error');
    alert('Erro ao excluir: '+e.message);
  }
}

function exportCSV(){
  if(!data.length){alert('Nenhum lead cadastrado para exportar.');return;}
  const cols=[
    ['nome','Nome do Dentista'],
    ['telefone','Telefone'],
    ['cidade_estado','Cidade/Estado'],
    ['bairro','Bairro'],
    ['executivo','Executivo/Gerente'],
    ['email','E-mail'],
    ['created_at','Data de Cadastro'],
  ];
  const esc=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const header=cols.map(([,l])=>esc(l)).join(';');
  const rows=data.map(d=>cols.map(([k])=>esc(d[k]||'')).join(';'));
  const csv='\uFEFF'+[header,...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Leads_OrtoSPO2026_'+today()+'.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function setTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.style.display='none');
  el.classList.add('active');
  document.getElementById('sec-'+tab).style.display='block';
  if(tab==='lista')renderAll();
}

document.querySelectorAll('.sec').forEach(s=>s.style.display='none');
document.getElementById('sec-cadastro').style.display='block';

loadData();
setInterval(()=>loadData(true),15000);
</script>
